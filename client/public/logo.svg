<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B26"/>
      <stop offset="50%" stop-color="#10131C"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Bracket Gradient -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="liveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bracketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Dark Squircle Shell -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Left Code Bracket < -->
  <path d="M46 42 L26 64 L46 86" fill="none" stroke="url(#bracketGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#bracketGlow)"/>

  <!-- Dynamic Slash / (Representing active cursor line) -->
  <path d="M72 38 L56 90" fill="none" stroke="url(#slashGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Right Code Bracket > -->
  <path d="M82 42 L102 64 L82 86" fill="none" stroke="url(#bracketGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#bracketGlow)"/>

  <!-- Real-Time Collaborative Multiplayer Live Indicator Pulse -->
  <circle cx="100" cy="28" r="8" fill="#10B981" fill-opacity="0.35"/>
  <circle cx="100" cy="28" r="5.5" fill="#10B981" filter="url(#liveGlow)"/>
  <circle cx="100" cy="28" r="2.5" fill="#FFFFFF"/>
</svg>
